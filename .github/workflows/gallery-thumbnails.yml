name: Create Gallery Thumbnail

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create test thumbnail
        run: |
          mkdir -p assets/images/gallery-thumbs
          convert "assets/images/Woodland Bridge.jpg" \
            -auto-orient \
            -resize "800x800>" \
            -strip \
            -quality 80 \
            "assets/images/gallery-thumbs/Woodland Bridge.webp"

      - name: Commit thumbnail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/images/gallery-thumbs/Woodland Bridge.webp"
          git commit -m "Add Woodland Bridge gallery thumbnail" || echo "No changes"
          git push
