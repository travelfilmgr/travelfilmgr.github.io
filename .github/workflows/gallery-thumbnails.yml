name: Create Gallery Thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create gallery thumbnails
        run: |
          mkdir -p assets/images/gallery-thumbs

          find assets/images -maxdepth 1 -type f \( \
            -iname "*.jpg" -o \
            -iname "*.jpeg" \
          \) -print0 |
          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            base="${filename%.*}"

            echo "Creating thumbnail: $filename"

            convert "$file" \
              -auto-orient \
              -resize "800x800>" \
              -strip \
              -quality 80 \
              "assets/images/gallery-thumbs/${base}.webp"
          done

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/images/gallery-thumbs/

          git commit -m "Create gallery thumbnails" || echo "No changes"

          git push
